<!DOCTYPE html>
<html>
<head>
  <title>Open Settings</title>
  <style>
    a {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007AFF;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <a href="intent://settings/#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end">
    Open Settings
  </a>

  <!-- Simple intent scheme -->
<a href="intent://settings#Intent;end">Open Settings</a>

<!-- Using android-app scheme -->
<a href="android-app://com.android.settings/">Open Settings</a>


</body>
</html>
